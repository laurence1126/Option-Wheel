<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Option Price Watcher</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 34rem
          ),
          #0f172a;
        color: #f8fafc;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .loading {
        display: grid;
        position: fixed;
        z-index: 1;
        inset: 0;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .loading.hidden {
        display: none;
      }

      .spinner {
        width: 46px;
        height: 46px;
        margin: 0 auto 18px;
        border: 4px solid rgba(147, 197, 253, 0.2);
        border-top-color: #93c5fd;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 30px;
      }

      p {
        margin-top: 12px;
        color: #b6c3d7;
        font-size: 16px;
      }

      .watcher-frame {
        width: 100%;
        min-height: 100vh;
        border: 0;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .watcher-frame.ready {
        opacity: 1;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Loading Option Watcher</h1>
        <p>Fetching the latest positions and market data...</p>
      </div>
    </div>

    <iframe
      class="watcher-frame"
      id="watcher-frame"
      title="Option Price Watcher"
      data-src="{{ url_for('option_watcher_content') }}"
    ></iframe>

    <script>
      const loading = document.querySelector("#loading");
      const watcherFrame = document.querySelector("#watcher-frame");

      function resizeWatcherFrame() {
        const watcherHeight =
          watcherFrame.contentDocument?.documentElement.scrollHeight;
        if (watcherHeight) {
          watcherFrame.style.height = `${watcherHeight}px`;
        }
      }

      watcherFrame.addEventListener("load", () => {
        resizeWatcherFrame();
        loading.classList.add("hidden");
        watcherFrame.classList.add("ready");
      });

      window.addEventListener("resize", resizeWatcherFrame);
      watcherFrame.src = watcherFrame.dataset.src;
    </script>
  </body>
</html>
