<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Option Wheel</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 34rem
          ),
          #0f172a;
        color: #f8fafc;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(640px, 100%);
        padding: 48px 40px;
        border: 2px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 8vw, 64px);
        letter-spacing: 0em;
        line-height: 1;
      }

      p {
        margin: 20px auto 0;
        color: #b6c3d7;
        font-size: 16px;
        line-height: 1.5;
      }

      @media (max-width: 540px) {
        main {
          padding: 38px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Option Wheel</h1>
      <p>
        The welcome page for monitoring and managing your option wheel strategy.
      </p>
    </main>
  </body>
</html>
