<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>{{ page_title }}</title>
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 34rem
          ),
          #0f172a;
        color: #f8fafc;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .loading {
        display: grid;
        position: fixed;
        z-index: 1;
        inset: 0;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .loading.hidden {
        display: none;
      }

      .spinner {
        width: 46px;
        height: 46px;
        margin: 0 auto 18px;
        border: 4px solid rgba(147, 197, 253, 0.2);
        border-top-color: #93c5fd;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 30px;
      }

      p {
        margin-top: 12px;
        color: #b6c3d7;
        font-size: 16px;
      }

      .watcher-frame {
        display: block;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        margin: auto 0;
        border: 0;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .watcher-frame.ready {
        min-height: 0;
        opacity: 1;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <h1>{{ loading_title }}</h1>
        <p>{{ loading_paragraph }}</p>
      </div>
    </div>

    <iframe
      class="watcher-frame"
      id="watcher-frame"
      title="{{ frame_title }}"
      data-src="{{ content_url }}"
    ></iframe>

    <script>
      const loading = document.querySelector("#loading");
      const watcherFrame = document.querySelector("#watcher-frame");
      const telegramApp = window.Telegram?.WebApp;
      let reportResizeObserver;

      if (telegramApp?.isVersionAtLeast?.("7.7")) {
        telegramApp.disableVerticalSwipes();
      }
      if (telegramApp?.isVersionAtLeast?.("8.0")) {
        telegramApp.requestFullscreen();
      }

      function resizeWatcherFrame() {
        const reportDocument = watcherFrame.contentDocument;
        const reportWrapper = reportDocument?.querySelector(".report-wrapper");
        const reportWindow = reportDocument?.defaultView;

        if (!reportDocument?.body || !reportWrapper || !reportWindow) {
          return;
        }

        const bodyStyle = reportWindow.getComputedStyle(reportDocument.body);
        const bodyPadding =
          Number.parseFloat(bodyStyle.paddingTop) +
          Number.parseFloat(bodyStyle.paddingBottom);
        const watcherHeight = Math.ceil(reportWrapper.offsetHeight + bodyPadding);

        if (watcherHeight > 0) {
          watcherFrame.style.height = `${watcherHeight}px`;
        }
      }

      watcherFrame.addEventListener("load", () => {
        loading.classList.add("hidden");
        watcherFrame.classList.add("ready");
        resizeWatcherFrame();

        reportResizeObserver?.disconnect();
        const reportWrapper =
          watcherFrame.contentDocument?.querySelector(".report-wrapper");
        if (reportWrapper && "ResizeObserver" in window) {
          reportResizeObserver = new ResizeObserver(resizeWatcherFrame);
          reportResizeObserver.observe(reportWrapper);
        }
      });

      window.addEventListener("resize", () => {
        window.requestAnimationFrame(resizeWatcherFrame);
      });
      watcherFrame.src = watcherFrame.dataset.src;
    </script>
  </body>
</html>
